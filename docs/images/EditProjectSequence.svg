<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<title>Edit Project: save before publishing</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#263547"/></marker></defs>
<rect width="1100" height="620" fill="white"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#263547">
<rect x="5" y="15" width="140" height="45" rx="4" fill="#eef3f8" stroke="#263547"/>
<text x="75" y="43" text-anchor="middle">User</text>
<line x1="75" y1="60" x2="75" y2="605" stroke="#8793a0" stroke-dasharray="5 5"/>
<rect x="180" y="15" width="140" height="45" rx="4" fill="#eef3f8" stroke="#263547"/>
<text x="250" y="43" text-anchor="middle">LogicManager</text>
<line x1="250" y1="60" x2="250" y2="605" stroke="#8793a0" stroke-dasharray="5 5"/>
<rect x="375" y="15" width="140" height="45" rx="4" fill="#eef3f8" stroke="#263547"/>
<text x="445" y="43" text-anchor="middle">EditProjectCommand</text>
<line x1="445" y1="60" x2="445" y2="605" stroke="#8793a0" stroke-dasharray="5 5"/>
<rect x="570" y="15" width="140" height="45" rx="4" fill="#eef3f8" stroke="#263547"/>
<text x="640" y="43" text-anchor="middle">proposed:Model</text>
<line x1="640" y1="60" x2="640" y2="605" stroke="#8793a0" stroke-dasharray="5 5"/>
<rect x="750" y="15" width="140" height="45" rx="4" fill="#eef3f8" stroke="#263547"/>
<text x="820" y="43" text-anchor="middle">Storage</text>
<line x1="820" y1="60" x2="820" y2="605" stroke="#8793a0" stroke-dasharray="5 5"/>
<rect x="930" y="15" width="140" height="45" rx="4" fill="#eef3f8" stroke="#263547"/>
<text x="1000" y="43" text-anchor="middle">live:Model</text>
<line x1="1000" y1="60" x2="1000" y2="605" stroke="#8793a0" stroke-dasharray="5 5"/>
<line x1="75" y1="105" x2="250" y2="105" stroke="#263547" marker-end="url(#arrow)"/>
<text x="162.5" y="96" text-anchor="middle">execute(edit-project …)</text>
<line x1="250" y1="160" x2="445" y2="160" stroke="#263547" marker-end="url(#arrow)"/>
<text x="347.5" y="151" text-anchor="middle">execute(proposed)</text>
<line x1="445" y1="215" x2="640" y2="215" stroke="#263547" marker-end="url(#arrow)"/>
<text x="542.5" y="206" text-anchor="middle">resolve and apply edit</text>
<line x1="445" y1="270" x2="250" y2="270" stroke="#263547" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="347.5" y="261" text-anchor="middle">CommandResult</text>
<line x1="250" y1="325" x2="820" y2="325" stroke="#263547" marker-end="url(#arrow)"/>
<text x="535.0" y="316" text-anchor="middle">saveAddressBook(proposed data)</text>
<rect x="10" y="348" width="1080" height="245" fill="none" stroke="#263547"/>
<rect x="10" y="348" width="40" height="24" fill="white" stroke="#263547"/>
<text x="18" y="365">alt</text><text x="65" y="367">[save fails]</text>
<line x1="820" y1="410" x2="250" y2="410" stroke="#263547" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="535.0" y="401" text-anchor="middle">IOException</text>
<line x1="250" y1="450" x2="75" y2="450" stroke="#263547" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="162.5" y="441" text-anchor="middle">CommandException (no changes)</text>
<line x1="10" y1="470" x2="1090" y2="470" stroke="#263547" stroke-dasharray="6 4"/>
<text x="65" y="490">[save succeeds]</text>
<line x1="820" y1="520" x2="250" y2="520" stroke="#263547" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="535.0" y="511" text-anchor="middle">saved</text>
<line x1="250" y1="550" x2="1000" y2="550" stroke="#263547" marker-end="url(#arrow)"/>
<text x="625.0" y="541" text-anchor="middle">setAddressBook(proposed data)</text>
<line x1="250" y1="582" x2="75" y2="582" stroke="#263547" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="162.5" y="573" text-anchor="middle">CommandResult (updated project)</text>
</g></svg>
